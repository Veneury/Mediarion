name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      # The sample configures one ordering layer twice, on MediatR 12.5.0 and on Mediarion, and
      # fails when the two stop agreeing step for step. It also compares the two layers as text
      # and fails if they differ by more than the using and the namespace, which is the readme's
      # claim written so a machine can check it.
      - name: Run the migration sample
        run: dotnet run --project samples/Mediarion.Migration/Mediarion.Migration.csproj --no-build --configuration Release

      # The pilot is an application, not a suite, and it checks its own journal and exits
      # non-zero when a line is wrong. It runs here because what it covers is the join between
      # the parts — a container, an open-generic behaviour and a closed one that refuses, a
      # pre-processor, a handler that publishes to two others — which is where a suite of unit
      # tests is least likely to look.
      - name: Run the pilot application
        run: dotnet run --project samples/Mediarion.Helpdesk/Mediarion.Helpdesk.csproj --no-build --configuration Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  aot:
    name: ahead-of-time
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The sample turns the AOT and trimming analysers on, so this step alone fails the build
      # on anything the trimmer cannot follow. Publishing and running it then proves the native
      # executable actually starts and dispatches: the sample checks its own answers and exits
      # non-zero when one is wrong.
      - name: Publish ahead of time
        run: dotnet publish samples/Mediarion.Aot/Mediarion.Aot.csproj --configuration Release --runtime win-x64 --output samples/Mediarion.Aot/publish

      - name: Run the native executable
        run: ./samples/Mediarion.Aot/publish/Mediarion.Aot.exe

  performance:
    name: performance budget
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # One scenario: a request through four behaviours and a handler. The empty pipeline in
      # SendBenchmarks is not measured here — seventeen nanoseconds and a third of movement
      # between runs of untouched code is a check that cries wolf. Mediator is not measured here
      # either: it is in the published comparison because it is the honest alternative, and it
      # says nothing about whether our own change cost anything.
      - name: Measure
        run: >
          dotnet run --project benchmarks/Mediarion.Benchmarks/Mediarion.Benchmarks.csproj
          --configuration Release --
          --filter "*PipelineBenchmarks*" --job short --exporters json

      # Fails on a time worse than the recorded multiple of MediatR measured in the same run, or
      # on a single byte more allocated per request than recorded.
      - name: Compare against the budget
        run: >
          dotnet run --project benchmarks/Mediarion.Benchmarks/Mediarion.Benchmarks.csproj
          --configuration Release --no-build --
          --budget benchmarks/baseline.json BenchmarkDotNet.Artifacts/results

      - name: Keep the measurements with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results
          if-no-files-found: ignore
