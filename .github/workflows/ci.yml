name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      # The sample configures one ordering layer twice, on MediatR 12.5.0 and on Mediarion, and
      # fails when the two stop agreeing step for step. It also compares the two layers as text
      # and fails if they differ by more than the using and the namespace, which is the readme's
      # claim written so a machine can check it.
      - name: Run the migration sample
        run: dotnet run --project samples/Mediarion.Migration/Mediarion.Migration.csproj --no-build --configuration Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  aot:
    name: ahead-of-time
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The sample turns the AOT and trimming analysers on, so this step alone fails the build
      # on anything the trimmer cannot follow. Publishing and running it then proves the native
      # executable actually starts and dispatches: the sample checks its own answers and exits
      # non-zero when one is wrong.
      - name: Publish ahead of time
        run: dotnet publish samples/Mediarion.Aot/Mediarion.Aot.csproj --configuration Release --runtime win-x64 --output samples/Mediarion.Aot/publish

      - name: Run the native executable
        run: ./samples/Mediarion.Aot/publish/Mediarion.Aot.exe
